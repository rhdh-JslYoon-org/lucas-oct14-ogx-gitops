apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lucas-ogx-oct14-app
  namespace: rhdh-app
  finalizers: ["resources-finalizer.argocd.argoproj.io"]
spec:
  project: default
  source:
    path: ./components/lucas-ogx-oct14/overlays/development
    repoURL: https://github.com/rhdh-JslYoon-org/lucas-oct14-ogx-gitops.git
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: rhdh-app
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: rhdh-app
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

